<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vietnam: The Deep Descent — Parabola · Marzo 2027</title>
<meta name="description" content="22 días de viaje lento y exploración de cavernas en Vietnam. Del norte en terrazas a seis noches dentro de la selva de Phong Nha-Kẻ Bàng. Marzo 3–24, 2027.">
<meta name="theme-color" content="#1F4A2A">
<meta property="og:title" content="Vietnam: The Deep Descent — Parabola">
<meta property="og:description" content="22 días · 2 expediciones · 6 noches de selva. Marzo 3–24, 2027.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F1E8;
    --ink:#152019;
    --ink2:#4C564E;
    --green:#2F6B3E;
    --green-deep:#1F4A2A;
    --acc:#E2531F;
    --acc-deep:#C2430F;
    --yellow:#FFD41F;
    --wa:#25D366;
    --line:rgba(21,32,25,.16);
    --line-c:rgba(244,241,232,.22);
    --sans:"Instrument Sans",Helvetica,sans-serif;
    --mono:"IBM Plex Mono",monospace;
    --ease:cubic-bezier(.22,1,.36,1);
    --pad:clamp(20px,5vw,72px);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--paper);color:var(--ink);font:400 16.5px/1.7 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  ::selection{background:var(--acc);color:var(--paper)}
  section{scroll-margin-top:84px}
  a{color:inherit;text-decoration:none}
  button{font:inherit;background:none;border:0;color:inherit}
  :focus-visible{outline:2px solid var(--acc);outline-offset:3px}
  .wrap{max-width:1240px;margin-inline:auto;padding-inline:var(--pad)}

  .label{display:flex;align-items:center;gap:14px;font:500 10px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--acc)}
  .label::before{content:"";width:28px;height:1px;background:currentColor;flex:none}
  .dark .label{color:var(--yellow)}
  .h2{font:500 clamp(2rem,4.4vw,3.4rem)/1.1 var(--sans);letter-spacing:-.03em}
  .sec-intro{max-width:52ch;color:var(--ink2);font-size:1.02rem}
  .dark .sec-intro{color:rgba(244,241,232,.75)}
  .sec-head{margin-bottom:clamp(2.6rem,5vw,4.4rem)}
  .sec-head .label{margin-bottom:1.4rem}

  .reveal{opacity:0;transform:translateY(18px);transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:var(--d,0s)}
  .reveal.in{opacity:1;transform:none}

  /* ——— Velo (versión rápida para subpáginas) ——— */
  #veil{position:fixed;inset:0;z-index:2000;background:var(--green-deep);display:grid;place-items:center;transition:transform .7s var(--ease)}
  #veil.lift{transform:translateY(-101%)}
  .veil-in{text-align:center}
  .veil-art{width:170px;display:block;margin:0 auto 16px}
  .vp{fill:none;stroke:var(--acc);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;animation:vdraw 1.1s .15s var(--ease) forwards}
  .vd{fill:var(--yellow);opacity:0;transform:scale(0);transform-origin:center;transform-box:fill-box;animation:vpop .45s var(--ease) forwards}
  .veil-word{display:block;font:500 12px var(--sans);letter-spacing:.44em;text-indent:.44em;color:var(--paper);opacity:0;animation:vfade .6s 1s forwards}
  @keyframes vdraw{to{stroke-dashoffset:0}}
  @keyframes vfade{to{opacity:1}}
  @keyframes vpop{to{opacity:1;transform:scale(1)}}

  /* ——— Ruta en rojo ——— */
  #route{position:fixed;inset:0;width:100%;height:100vh;pointer-events:none;z-index:3}
  #routePath{stroke:var(--acc);stroke-width:2.2;fill:none;stroke-linecap:round}
  #tip{fill:var(--acc)}
  #tipRing{stroke:var(--acc);fill:none;stroke-width:1.2;transform-box:fill-box;transform-origin:center;animation:ringp 2.8s var(--ease) infinite}
  @keyframes ringp{0%{transform:scale(.6);opacity:.8}70%{transform:scale(1.7);opacity:0}100%{transform:scale(1.7);opacity:0}}
  .node{fill:var(--paper);stroke:var(--acc);stroke-width:1.6;transition:fill .5s}
  .node.on{fill:var(--acc)}
  .node-label{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;opacity:0;transition:opacity .6s}
  .node-label.on{opacity:1}
  .node-label.lt{fill:var(--ink)}
  .node-label.dk{fill:var(--paper)}

  /* ——— Header ——— */
  #top{position:fixed;inset:0 0 auto 0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px var(--pad);color:var(--paper);transition:background .45s,color .45s,padding .45s,border-color .45s;border-bottom:1px solid transparent}
  #top.scrolled{background:rgba(244,241,232,.92);backdrop-filter:blur(10px);color:var(--ink);padding-block:13px;border-color:var(--line)}
  .brand{display:flex;align-items:center;gap:11px;font:600 12px var(--sans);letter-spacing:.34em}
  .brand svg{width:34px;display:block}
  .brand svg path{stroke:var(--acc);stroke-width:2.4;fill:none;stroke-linecap:round}
  .top-nav{display:flex;gap:30px}
  .top-nav a{position:relative;font:500 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;padding-block:5px}
  .top-nav a::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .4s var(--ease)}
  .top-nav a:hover::after{transform:scaleX(1);transform-origin:left}
  .lang{display:flex;align-items:center;gap:5px;font:500 11px var(--mono);letter-spacing:.08em}
  .lang span{opacity:.4}
  .lang button{opacity:.55;padding:4px 2px;transition:opacity .3s}
  .lang button:hover{opacity:.85}
  .lang button.on{opacity:1;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--acc)}
  #menuBtn{display:none;width:38px;height:38px;position:relative}
  #menuBtn span{position:absolute;left:8px;right:8px;height:1.5px;background:currentColor;transition:transform .4s var(--ease),top .4s var(--ease)}
  #menuBtn span:first-child{top:15px}
  #menuBtn span:last-child{top:23px}
  body.menu-open #menuBtn span:first-child{top:19px;transform:rotate(45deg)}
  body.menu-open #menuBtn span:last-child{top:19px;transform:rotate(-45deg)}
  #menu{position:fixed;inset:0;z-index:95;background:var(--paper);display:flex;flex-direction:column;justify-content:center;padding:var(--pad);opacity:0;visibility:hidden;transition:opacity .45s var(--ease),visibility .45s}
  body.menu-open #menu{opacity:1;visibility:visible}
  #menu nav{display:flex;flex-direction:column;gap:4px}
  #menu a.m-link{font:500 clamp(1.7rem,7vw,2.4rem)/1.3 var(--sans);letter-spacing:-.02em;display:flex;align-items:baseline;gap:16px;opacity:0;transform:translateY(16px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
  #menu a.m-link small{font:500 10px var(--mono);letter-spacing:.2em;color:var(--acc)}
  body.menu-open #menu a.m-link{opacity:1;transform:none}
  body.menu-open #menu nav a:nth-child(1){transition-delay:.07s}
  body.menu-open #menu nav a:nth-child(2){transition-delay:.13s}
  body.menu-open #menu nav a:nth-child(3){transition-delay:.19s}
  body.menu-open #menu nav a:nth-child(4){transition-delay:.25s}
  body.menu-open #menu nav a:nth-child(5){transition-delay:.31s}
  .menu-contact{margin-top:2.4rem;display:flex;flex-direction:column;gap:.55rem;font:400 13px var(--mono);letter-spacing:.03em;color:var(--ink2)}
  .menu-contact a{text-decoration:underline;text-underline-offset:3px;width:fit-content}
  .menu-contact a:hover{color:var(--acc)}

  /* ——— Botones ——— */
  .btn{display:inline-flex;align-items:center;gap:14px;background:var(--acc);color:var(--paper);padding:17px 26px;border:1px solid var(--acc);font:600 11px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;transition:background .35s,border-color .35s}
  .btn:hover{background:var(--acc-deep);border-color:var(--acc-deep)}
  .btn svg{transition:transform .4s var(--ease)}
  .btn:hover svg{transform:translateX(5px)}
  .btn.ghost{background:transparent;color:var(--paper);border-color:rgba(244,241,232,.5)}
  .btn.ghost:hover{background:var(--paper);border-color:var(--paper);color:var(--green-deep)}
  .tlink{font:600 11px var(--sans);letter-spacing:.18em;text-transform:uppercase;border-bottom:1px solid currentColor;padding-bottom:4px;transition:color .3s}
  .tlink:hover{color:var(--acc)}
  .dark .tlink:hover{color:var(--yellow)}

  /* ——— Hero ——— */
  .hero{position:relative;min-height:92svh;background:var(--green);color:var(--paper);display:flex;flex-direction:column;justify-content:flex-end;padding:120px var(--pad) 44px;overflow:hidden}
  .hero::before{content:"";position:absolute;inset:0;background:
    radial-gradient(55% 45% at 18% 22%,rgba(255,255,255,.06),transparent 60%),
    radial-gradient(45% 40% at 78% 12%,rgba(0,0,0,.16),transparent 60%),
    radial-gradient(60% 50% at 70% 85%,rgba(255,255,255,.05),transparent 55%),
    radial-gradient(40% 45% at 30% 80%,rgba(0,0,0,.18),transparent 60%)}
  .hero-art{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .hero-art path{stroke:var(--paper);fill:none;stroke-width:1.3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:hdraw 2.2s var(--ease) forwards}
  .hero-art path:nth-child(2){animation-delay:.35s;animation-duration:2.6s}
  .hero-art circle{fill:var(--paper);opacity:0;animation:hfade 1s .9s forwards}
  @keyframes hdraw{to{stroke-dashoffset:0}}
  @keyframes hfade{to{opacity:.4}}
  .hero-inner{position:relative;z-index:2;max-width:1240px;width:100%;margin-inline:auto}
  .hero .label{margin-bottom:clamp(1.4rem,3vw,2rem)}
  .h1{font:500 clamp(2.4rem,6.6vw,5.4rem)/1.05 var(--sans);letter-spacing:-.03em}
  .h1 .line{display:block;overflow:hidden}
  .h1 .line>span{display:block;transform:translateY(110%);transition:transform 1s var(--ease)}
  body.ready .h1 .line>span{transform:none}
  .h1 .line:nth-child(2)>span{transition-delay:.09s}
  .h1 .dot{color:var(--acc)}
  .hero-sub{max-width:54ch;margin-top:clamp(1.4rem,3vw,2rem);color:rgba(244,241,232,.85);font-size:1.05rem}
  .hero-cta{display:flex;align-items:center;gap:30px;flex-wrap:wrap;margin-top:clamp(1.6rem,3.5vw,2.4rem)}
  .hero-foot{position:relative;z-index:2;max-width:1240px;margin:clamp(2.2rem,5vh,3.6rem) auto 0;display:flex;justify-content:space-between;align-items:flex-end;gap:18px;font:500 10px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:rgba(244,241,232,.65);opacity:0;transition:opacity 1s .9s}
  body.ready .hero-foot{opacity:1}
  .scroll-hint{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--paper)}
  .scroll-hint .vline{width:1px;height:40px;background:rgba(244,241,232,.35);position:relative;overflow:hidden;display:block}
  .scroll-hint .vline::after{content:"";position:absolute;inset:0;background:var(--acc);animation:drip 2s var(--ease) infinite}
  @keyframes drip{0%{transform:translateY(-100%)}55%{transform:translateY(0)}100%{transform:translateY(100%)}}

  .paper-bg{background-image:radial-gradient(rgba(21,32,25,.10) 1px,transparent 1.1px);background-size:26px 26px}
  .dark{background:var(--green);color:var(--paper)}

  /* ——— Intro ——— */
  .manif{padding:clamp(5.5rem,12vh,9rem) 0}
  .manif-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:24px}
  .manif-copy{grid-column:5/13;max-width:62ch}
  .lede{font:400 clamp(1.06rem,1.45vw,1.24rem)/1.65 var(--sans);color:var(--ink2)}
  .lede+.lede{margin-top:1.4em}
  .lede strong{font-weight:600;color:var(--ink)}
  .pull{grid-column:1/10;margin-top:clamp(3rem,6vw,4.8rem);padding-top:clamp(1.8rem,4vw,2.6rem);border-top:1px solid var(--line);font:500 clamp(1.4rem,2.8vw,2.2rem)/1.25 var(--sans);letter-spacing:-.02em;max-width:26ch}
  .hl{background:var(--yellow);padding:.02em .14em;-webkit-box-decoration-break:clone;box-decoration-break:clone}

  /* ——— El descenso (corte geológico) ——— */
  .descenso{padding:clamp(5.5rem,12vh,9rem) 0}
  .descenso .sec-head .h2{margin-top:1.4rem}
  .descenso .sec-head .sec-intro{margin-top:1.4rem}
  .pf-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .pf-scroll svg{display:block;width:100%;min-width:640px;height:auto}
  .mp{stroke:var(--acc);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 2.2s var(--ease) .3s}
  .descenso.in .mp{stroke-dashoffset:0}
  .mdot{opacity:0;transition:opacity .8s 1.6s}
  .descenso.in .mdot{opacity:1}
  .chapters{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(1.6rem,3vw,2.6rem);margin-top:clamp(3rem,6vw,4.5rem)}
  .chapter{border-top:1px solid var(--line);padding-top:1.3rem}
  .chapter .ch-n{font:500 11px var(--mono);letter-spacing:.2em;color:var(--acc)}
  .chapter h3{font:500 1.35rem/1.25 var(--sans);letter-spacing:-.02em;margin:.7rem 0 .2rem}
  .chapter .ch-r{font:500 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
  .chapter p{font-size:.95rem;color:var(--ink2);margin-top:.7rem}
  .chapter .ch-h{font:400 11px var(--mono);letter-spacing:.02em;color:var(--ink2);margin-top:.9rem;padding-top:.8rem;border-top:1px dashed var(--line)}

  /* ——— Itinerario ——— */
  .itin-sec{padding:clamp(5.5rem,12vh,9rem) 0}
  .itin-sec .sec-head .h2{margin-top:1.4rem}
  .itin-sec .sec-head .sec-intro{margin-top:1.4rem}
  .ch-group-head{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;padding:1.1rem 0;border-bottom:1px solid var(--line);font:500 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink2)}
  .ch-group-head:first-child{padding-top:0}
  .ch-group-head b{color:var(--acc);font-weight:500}
  .ch-group-head .gt{font:500 1.05rem var(--sans);letter-spacing:-.01em;text-transform:none;color:var(--ink)}
  .acc{border-top:1px solid var(--line);margin-bottom:clamp(2.4rem,5vw,3.6rem)}
  .acc-item{border-bottom:1px solid var(--line)}
  .acc-head{width:100%;display:grid;grid-template-columns:52px 1fr 34px;gap:clamp(1rem,2.5vw,2rem);align-items:center;padding:1.15rem 0;text-align:left}
  .d-num{font:500 12px var(--mono);letter-spacing:.12em;color:var(--acc)}
  .d-title{display:block;font:500 clamp(1.02rem,1.7vw,1.3rem)/1.3 var(--sans);letter-spacing:-.01em;transition:transform .4s var(--ease)}
  .d-date{display:block;font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-top:.15rem}
  .acc-head:hover .d-title{transform:translateX(10px)}
  .acc-x{position:relative;width:14px;height:14px;justify-self:end}
  .acc-x::before,.acc-x::after{content:"";position:absolute;background:var(--acc);transition:transform .45s var(--ease)}
  .acc-x::before{left:0;right:0;top:6.5px;height:1.5px}
  .acc-x::after{top:0;bottom:0;left:6.5px;width:1.5px}
  .acc-item.open .acc-x::after{transform:rotate(90deg)}
  .acc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s var(--ease)}
  .acc-item.open .acc-body{grid-template-rows:1fr}
  .acc-body-in{overflow:hidden}
  .d-body{padding:0 0 1.6rem calc(52px + clamp(1rem,2.5vw,2rem))}
  .d-body p{max-width:60ch;color:var(--ink2);font-size:.98rem}
  .d-ox{display:inline-block;margin-top:1rem;font:500 10px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--acc);border-bottom:1px solid currentColor;padding-bottom:3px}
  .d-ox:hover{color:var(--acc-deep)}
  .d-meta{display:grid;grid-template-columns:1fr 1fr;gap:1rem 2rem;margin-top:1.3rem;padding-top:1.1rem;border-top:1px dashed var(--line)}
  .d-meta span{display:block;font:500 9px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin-bottom:.25rem}
  .d-meta b{font:400 .92rem var(--sans);color:var(--ink)}
  .d-meta b a{text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(21,32,25,.35)}
  .d-meta b a:hover{color:var(--acc)}

  /* ——— Tarifas ——— */
  .rates{padding:clamp(5.5rem,12vh,9rem) 0;background:var(--green-deep);color:var(--paper)}
  .rates .sec-head .h2{margin-top:1.4rem}
  .rates .sec-head .sec-intro{margin-top:1.4rem}
  .prices{display:grid;grid-template-columns:1fr 1fr;gap:clamp(1.4rem,3vw,2.4rem)}
  .price{background:var(--paper);color:var(--ink);padding:clamp(1.6rem,3vw,2.4rem)}
  .price .p-l{font:500 10px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--acc)}
  .price .p-v{font:500 clamp(1.9rem,3.4vw,2.8rem)/1.1 var(--sans);letter-spacing:-.02em;margin:.8rem 0 .3rem}
  .price .p-s{font-size:.9rem;color:var(--ink2)}
  .notes{margin-top:clamp(2rem,4vw,3rem);list-style:none;max-width:72ch}
  .notes li{display:flex;gap:12px;font:400 12px var(--mono);letter-spacing:.03em;line-height:1.7;color:rgba(244,241,232,.62);padding:.55rem 0}
  .notes li::before{content:"·";color:var(--acc);flex:none}
  .incl{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,5vw,4rem);margin-top:clamp(3rem,6vw,4.5rem);padding-top:clamp(2rem,4vw,3rem);border-top:1px solid var(--line-c)}
  .incl h4{font:500 10px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--yellow);margin-bottom:1.2rem}
  .incl ul{list-style:none}
  .incl li{display:flex;gap:10px;padding:.6rem 0;font-size:.94rem;color:rgba(244,241,232,.72);line-height:1.6}
  .incl li::before{content:"—";color:var(--acc);flex:none}
  .incl li strong{color:var(--paper);font-weight:600}

  /* ——— CTA ——— */
  .apply{padding:clamp(5.5rem,12vh,9rem) 0;background:var(--green);color:var(--paper)}
  .apply .sec-head .h2{margin-top:1.4rem}
  .apply .sec-head .sec-intro{margin-top:1.4rem}
  .cta-row{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  .cta-micro{margin-top:1.6rem;font:400 11px var(--mono);letter-spacing:.06em;color:rgba(244,241,232,.55)}

  /* ——— WhatsApp flotante ——— */
  #waFloat{position:fixed;right:clamp(16px,3vw,28px);bottom:clamp(16px,3vw,28px);z-index:120;display:flex;align-items:center;background:var(--wa);color:#fff;padding:15px;border-radius:999px;box-shadow:0 12px 30px rgba(15,35,20,.28);opacity:0;transform:translateY(14px);transition:opacity .6s .8s,transform .6s .8s var(--ease),background .3s}
  body.ready #waFloat{opacity:1;transform:none}
  #waFloat:hover{background:#1DB954}
  #waFloat svg{width:26px;height:26px;display:block;position:relative;z-index:1}
  #waFloat::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 0 rgba(37,211,102,.5);animation:wap 3.4s infinite}
  @keyframes wap{0%{box-shadow:0 0 0 0 rgba(37,211,102,.45)}60%{box-shadow:0 0 0 16px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
  .wa-tip{font:600 12px var(--sans);letter-spacing:.02em;white-space:nowrap;max-width:0;overflow:hidden;transition:max-width .45s var(--ease);position:relative;z-index:1}
  #waFloat:hover .wa-tip{max-width:220px;margin-left:10px}

  /* ——— Footer ——— */
  footer{background:var(--green-deep);color:var(--paper);border-top:1px solid var(--line-c)}
  .foot-grid{display:grid;grid-template-columns:1.1fr .9fr .9fr;gap:clamp(2rem,5vw,4rem);padding-block:clamp(2.6rem,5vw,4rem)}
  .foot-grid p{color:rgba(244,241,232,.7);font-size:.94rem;max-width:30ch}
  .foot-col h4{font:500 10px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--yellow);margin-bottom:1.1rem}
  .foot-col ul{list-style:none;display:flex;flex-direction:column;gap:.6rem}
  .foot-col a{font-size:.94rem;color:rgba(244,241,232,.78);transition:color .3s;display:inline-flex;align-items:center;gap:9px}
  .foot-col a:hover{color:var(--paper)}
  .foot-col a svg{width:15px;height:15px;flex:none}
  .foot-brand{display:flex;align-items:center;gap:10px;font:600 12px var(--sans);letter-spacing:.34em;margin-bottom:1.2rem}

     x:{es:"Día de profundizar en el paisaje kárstico: nado por cuevas de río subterráneas, paso por salas de caverna enormes y navegación de valles de selva que conectan los sistemas. Llegada al siguiente campamento a la orilla del río para una tarde relajada junto al agua.",
        en:"Break camp after breakfast to trek deeper into the karst landscape. Today's journey involves swimming through underground river caves, climbing through massive cavern halls, and navigating lush jungle valleys connecting the cave systems. Arrive at the next riverbank campsite in the late afternoon for a relaxing evening by the water."}},
    {n:17, m:"bld", camp:true, ox:OX_TL,
     t:{es:"Tu Lan — cavernas y valles (día 3)",en:"Tu Lan — Massive Caverns & Jungle Valleys (Day 3)"},
     x:{es:"Trekking por selva lluviosa primaria y pasos de caliza. Hoy tocan algunas de las cámaras más grandes de Tu Lan, con estalactitas impresionantes y claraboyas naturales. Cierre del día en un campamento ribereño: baño en pozas de selva antes del atardecer.",
        en:"Trek through pristine primary rainforest and navigate towering limestone passages. Today features some of Tu Lan's largest cavern chambers, complete with impressive stalactites and natural skylights. Finish the day at a tranquil riverside campsite, swimming in natural jungle pools before sunset."}},
    {n:18, m:"bld", camp:true, ox:OX_TL,
     t:{es:"Tu Lan — sistemas profundos y claraboyas (día 4)",en:"Tu Lan — Deep Systems & Skylights (Day 4)"},
     x:{es:"Últimas cuevas salvajes del sistema: pasos de río, cámaras secas y valles de selva. Dolinas de colapso por donde la luz del sol atraviesa el dosel y alimenta ecosistemas aislados bajo tierra. Campamento final y última noche celebratoria en la jungla.",
        en:"Journey through the final wilderness caves of the system, traversing river passages, dry subterranean chambers, and lush forest valleys. Marvel at massive collapse dolines where sunlight pierces the canopy, nourishing isolated ecosystems deep underground. Reach the final wilderness camp for a celebratory last evening in the jungle."}},
    {n:19, m:"b", h:"Pilgrimage Village, Hue", u:"https://www.pilgrimagevillage.com/", ox:OX_TL,
     t:{es:"Cierre de Tu Lan y traslado a Hue",en:"Concluding Tu Lan & Transfer to Hue"},
     x:{es:"Despertar con vistas brumosas de los picos de caliza desde Tu Lan Lodge. Paseo guiado en bici por los caminos rurales de Tan Hoa —maizales, huertos de cacahuate, granjas locales— con paradas para probar cacahuate tostado y té de jengibre con miel. Después, transporte privado al sur, pasando la DMZ, hasta la ciudad imperial de Hue.",
        en:"Wake up to misty morning views of limestone peaks at Tu Lan Lodge. After breakfast, a guided bicycle ride through Tan Hoa's rural paths — past cornfields and peanut gardens, visiting local farms, and sampling regional specialties like roasted peanuts and ginger honey tea. After check-out, private transport transfers the group south past the DMZ toward the imperial city of Hue."}},
    {n:20, m:"b", h:"Pilgrimage Village, Hue", u:"https://www.pilgrimagevillage.com/",
     t:{es:"Hue — descanso y cultura",en:"Hue — Leisure & Cultural Exploration"},
     x:{es:"Día para descansar y explorar Hue a tu ritmo: piscina del resort o visitas históricas. Sugerencias: la Ciudadela Imperial y la Ciudad Púrpura Prohibida, o un paseo en barco al atardecer por el Río de los Perfumes hacia la pagoda Thien Mu.",
        en:"A day to rest and explore Hue at your own pace: the resort's pools or the nearby historic sites. Recommended self-guided visits: the historic Imperial Citadel and Forbidden Purple City, or a sunset boat ride along the Perfume River toward Thien Mu Pagoda."}},
    {n:21, m:"b", h:"Pilgrimage Village, Hue", u:"https://www.pilgrimagevillage.com/",
     t:{es:"Hue — campo y cocina",en:"Hue — Countryside & Culinary Discovery"},
     x:{es:"Otro día libre para recargar después de las expediciones. Sugerencias: las tumbas reales de Tu Duc o Khai Dinh entre colinas, o la escena culinaria de Hue, del Bún Bò Huế de calle a la cocina de corte real.",
        en:"Another full day at leisure to recharge after the wilderness expeditions. Recommended: the royal tombs of Tu Duc or Khai Dinh set among the surrounding hills, or Hue's celebrated culinary scene, from street-side Bún Bò Huế to traditional royal court cuisine."}},
    {n:22, m:"b", h:null,
     t:{es:"Salida desde Hue",en:"Departure from Hue"},
     x:{es:"Desayuno en el resort y día libre para relajarse o seguir explorando Hue. Los traslados al aeropuerto se coordinan de forma independiente según el horario del vuelo de salida.",
        en:"Breakfast at the resort followed by a full day at leisure to relax or explore Hue on your own. Departure and airport transfers are arranged independently according to your onward flight schedule."}}
  ];

  let LANG = "es";
  function t(k){ return (I18N[LANG] && I18N[LANG][k]) || I18N.es[k] || ""; }
  const pad = (n)=> String(n).padStart(2,"0");
  const esc = (s)=> s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const mealsStr = (m)=>{
    if(m === "n") return t("dy.none");
    const parts = [];
    if(m.includes("b")) parts.push(t("dy.b"));
    if(m.includes("l")) parts.push(t("dy.l"));
    if(m.includes("d")) parts.push(t("dy.d"));
    return parts.join(" · ");
  };
  const dateStr = (n)=> LANG === "es" ? (n + " DE MARZO") : ("MAR " + n);

  function setWaLinks(){
    const href = "https://wa.me/525651100276?text=" + encodeURIComponent(t("wa.msg"));
    $$(".wa-link").forEach(a=> a.href = href);
  }

  /* ——— Render: capítulos ——— */
  function renderChapters(){
    $("#chapters").innerHTML = CH.map(c=>
      '<article class="chapter">' +
        '<span class="ch-n">' + c.n + '</span>' +
        '<h3>' + esc(c.t[LANG]) + '</h3>' +
        '<span class="ch-r">' + t("ch.days") + ' ' + c.d + ' · ' + esc(c.r) + '</span>' +
        '<p>' + esc(c.p[LANG]) + '</p>' +
        '<span class="ch-h">' + esc(c.h) + '</span>' +
      '</article>'
    ).join("");
  }

  /* ——— Render: itinerario ——— */
  function renderItin(){
    const html = CH.map(c=>{
      const days = ITIN.filter(d=> {
        const [a,b] = c.d.split("–").map(Number);
        return d.n >= a && d.n <= b;
      });
      return '<div class="ch-group-head"><b>' + t("ch.word").toUpperCase() + ' ' + c.n + '</b>' +
             '<span class="gt">' + esc(c.t[LANG]) + '</span>' +
             '<span>' + t("ch.days") + ' ' + c.d + '</span></div>' +
             '<div class="acc">' + days.map(d=>{
               let night = "";
               if(d.h) night = d.u
                 ? '<a href="' + d.u + '" target="_blank" rel="noopener">' + esc(d.h) + ' ↗</a>'
                 : esc(d.h);
               else if(d.camp) night = t("dy.camp");
               else night = t("dy.end");
               return '<div class="acc-item day' + (d.n === 1 ? ' open' : '') + '">' +
                 '<button class="acc-head" aria-expanded="' + (d.n === 1) + '">' +
                   '<span class="d-num">' + pad(d.n) + '</span>' +
                   '<span><span class="d-title">' + esc(d.t[LANG]) + '</span>' +
                   '<span class="d-date">' + t("dy.day") + ' ' + pad(d.n) + ' · ' + dateStr(d.n) + '</span></span>' +
                   '<span class="acc-x" aria-hidden="true"></span>' +
                 '</button>' +
                 '<div class="acc-body"><div class="acc-body-in"><div class="d-body">' +
                   '<p>' + esc(d.x[LANG]) + '</p>' +
                   (d.ox ? '<a class="d-ox" href="' + d.ox + '" target="_blank" rel="noopener">' + t("dy.ox") + ' ↗</a>' : "") +
                   '<div class="d-meta">' +
                     '<div><span>' + t("dy.meals") + '</span><b>' + mealsStr(d.m) + '</b></div>' +
                     '<div><span>' + t("dy.night") + '</span><b>' + night + '</b></div>' +
                   '</div>' +
                 '</div></div></div>' +
               '</div>';
             }).join("") + '</div>';
    }).join("");
    $("#itin").innerHTML = html;
  }

  /* ——— Render: notas + listas ——— */
  function renderLists(){
    $("#notes").innerHTML = '<li style="color:var(--yellow);font-weight:500">' + t("pr.notes").toUpperCase() + '</li>' +
      NOTES.map(n=> '<li>' + esc(n[LANG]) + '</li>').join("");
    const li = (arr)=> arr.map(i=> '<li><strong>' + esc(i.b[LANG]) + ':</strong> ' + esc(i.x[LANG]) + '</li>').join("");
    $("#incList").innerHTML = li(INC);
    $("#excList").innerHTML = li(EXC);
  }

  function applyLang(l){
    LANG = (l === "en") ? "en" : "es";
    try{ localStorage.setItem("pb-lang", LANG); }catch(e){}
    document.documentElement.setAttribute("lang", LANG);
    document.title = t("doc.title");
    $$("[data-i18n]").forEach(el=> el.textContent = t(el.dataset.i18n));
    $$("[data-i18n-html]").forEach(el=> el.innerHTML = t(el.dataset.i18nHtml));
    $$(".lang button").forEach(b=> b.classList.toggle("on", b.dataset.lang === LANG));
    setWaLinks();
    $("#mailCta").href = "mailto:hola@parabola.com.mx?subject=" + encodeURIComponent(t("mail.sub")) + "&body=" + encodeURIComponent(t("mail.body"));
    renderChapters(); renderItin(); renderLists();
    buildRoute();
  }
  $$(".lang button").forEach(b=> b.addEventListener("click", ()=> applyLang(b.dataset.lang)));

  /* ——— Velo ——— */
  const veil = $("#veil");
  let revealed = false;
  function initReveals(){
    if(revealed) return; revealed = true;
    const io = new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
    },{threshold:.12,rootMargin:"0px 0px -6% 0px"});
    $$(".reveal").forEach(el=> io.observe(el));
  }
  function lift(){
    if(document.body.classList.contains("ready")) return;
    document.body.classList.add("ready");
    veil.classList.add("lift");
    setTimeout(()=>{ veil.remove(); initReveals(); }, 720);
  }
  /* PRODUCCIÓN: si el velo molesta en navegación interna, bajar 2200 a 1400 */
  if(RM){ veil.remove(); document.body.classList.add("ready"); initReveals(); }
  else { setTimeout(lift, 2200); setTimeout(lift, 5000); }

  /* ——— Figura del descenso: se dibuja al entrar en pantalla ——— */
  const bandIO = new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add("in"); bandIO.unobserve(e.target); } });
  },{threshold:.3});
  $$(".descenso").forEach(el=> bandIO.observe(el));

  /* ——— Header ——— */
  const top = $("#top");
  addEventListener("scroll", ()=> top.classList.toggle("scrolled", scrollY > 24), {passive:true});

  /* ——— Menú móvil ——— */
  const menuBtn = $("#menuBtn");
  menuBtn.addEventListener("click", ()=>{
    const open = document.body.classList.toggle("menu-open");
    menuBtn.setAttribute("aria-expanded", String(open));
    document.body.style.overflow = open ? "hidden" : "";
  });
  $$("#menu a").forEach(a=> a.addEventListener("click", ()=>{
    document.body.classList.remove("menu-open");
    menuBtn.setAttribute("aria-expanded","false");
    document.body.style.overflow = "";
  }));

  /* ——— Acordeones (delegación: sobrevive re-renders de idioma) ——— */
  $("#itin").addEventListener("click", function(e){
    const head = e.target.closest(".acc-head");
    if(!head) return;
    const item = head.parentElement;
    const was = item.classList.contains("open");
    $$("#itin .acc-item.open").forEach(o=>{
      o.classList.remove("open");
      $(".acc-head", o).setAttribute("aria-expanded","false");
    });
    if(!was){ item.classList.add("open"); head.setAttribute("aria-expanded","true"); }
  });

  /* ——— La ruta en rojo ——— */
  const svg = $("#route"), g = $("#routeG"), path = $("#routePath"),
        tip = $("#tip"), ring = $("#tipRing"), nodesG = $("#nodes");
  const SVGNS = "http://www.w3.org/2000/svg";
  let total = 0, nodeEls = [], nodeLens = [];

  function prnd(n){ const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
  function smooth(p){
    let d = "M " + p[0].x + " " + p[0].y;
    for(let i = 0; i < p.length - 1; i++){
      const p0 = p[Math.max(0,i-1)], p1 = p[i], p2 = p[i+1], p3 = p[Math.min(p.length-1,i+2)];
      d += " C " + (p1.x+(p2.x-p0.x)/6) + " " + (p1.y+(p2.y-p0.y)/6) + ", "
                 + (p2.x-(p3.x-p1.x)/6) + " " + (p2.y-(p3.y-p1.y)/6) + ", " + p2.x + " " + p2.y;
    }
    return d;
  }
  function buildRoute(){
    const W = innerWidth;
    const docH = document.documentElement.scrollHeight;
    svg.setAttribute("viewBox", "0 0 " + W + " " + innerHeight);
    const anchors = $$("[data-route]").map((s,i)=>{
      const r = s.getBoundingClientRect();
      const isHero = s.id === "viaje";
      return {
        x: W * parseFloat(s.dataset.x || (i % 2 ? ".86" : ".14")),
        y: isHero ? (r.bottom + scrollY - 140) : (r.top + scrollY + 64),
        label: t(s.dataset.route),
        dark: s.classList.contains("dark") || s.dataset.th === "dk" || s.classList.contains("rates")
      };
    });
    let pts = [{x: W * .5, y: -80}];
    anchors.forEach((a,i)=>{
      const prev = pts[pts.length-1];
      for(let k = 1; k <= 2; k++){
        const tt = k / 3;
        const dx = a.x - prev.x, dy = a.y - prev.y;
        const len = Math.hypot(dx, dy) || 1;
        const amp = (prnd(i * 7 + k) - .5) * 120;
        pts.push({ x: clamp(prev.x + dx * tt - (dy/len) * amp, 24, W - 24),
                   y: prev.y + dy * tt + (dx/len) * amp });
      }
      pts.push({x: a.x, y: a.y});
    });
    pts.push({x: W * .55, y: docH + 80});
    path.setAttribute("d", smooth(pts));
    total = path.getTotalLength();
    path.style.strokeDasharray = total;
    path.style.strokeDashoffset = RM ? 0 : total;
    nodesG.innerHTML = ""; nodeEls = []; nodeLens = [];
    anchors.forEach(a=>{
      const c = document.createElementNS(SVGNS, "circle");
      c.setAttribute("cx", a.x); c.setAttribute("cy", a.y); c.setAttribute("r", "5");
      c.setAttribute("class", "node");
      const tx = document.createElementNS(SVGNS, "text");
      tx.textContent = a.label;
      tx.setAttribute("class", "node-label " + (a.dark ? "dk" : "lt"));
      if(a.x > W * .5){ tx.setAttribute("text-anchor","end"); tx.setAttribute("x", a.x - 16); }
      else { tx.setAttribute("text-anchor","start"); tx.setAttribute("x", a.x + 16); }
      tx.setAttribute("y", a.y + 3.5);
      nodesG.appendChild(c); nodesG.appendChild(tx);
      nodeEls.push([c, tx]); nodeLens.push(nearestLen(a));
    });
    if(RM) nodeEls.forEach(p=>{ p[0].classList.add("on"); p[1].classList.add("on"); });
  }
  function nearestLen(pt){
    let best = 0, bd = Infinity;
    for(let l = 0; l <= total; l += 40){
      const q = path.getPointAtLength(l);
      const d = (q.x-pt.x)*(q.x-pt.x) + (q.y-pt.y)*(q.y-pt.y);
      if(d < bd){ bd = d; best = l; }
    }
    for(let l = Math.max(0, best-40); l <= Math.min(total, best+40); l += 2){
      const q = path.getPointAtLength(l);
      const d = (q.x-pt.x)*(q.x-pt.x) + (q.y-pt.y)*(q.y-pt.y);
      if(d < bd){ bd = d; best = l; }
    }
    return best;
  }
  let tP = 0, cP = 0, tY = scrollY, cY = scrollY;
  function onScroll(){
    tY = scrollY;
    const max = document.documentElement.scrollHeight - innerHeight;
    tP = max > 0 ? Math.min(1, scrollY / max) : 0;
  }
  addEventListener("scroll", onScroll, {passive:true});
  onScroll();
  function tick(){
    cY += (tY - cY) * .1; cP += (tP - cP) * .08;
    if(Math.abs(tY - cY) < .05) cY = tY;
    if(Math.abs(tP - cP) < .0004) cP = tP;
    g.setAttribute("transform", "translate(0 " + (-cY) + ")");
    const drawn = cP * total;
    path.style.strokeDashoffset = total - drawn;
    const p = path.getPointAtLength(drawn);
    tip.setAttribute("cx", p.x); tip.setAttribute("cy", p.y);
    ring.setAttribute("cx", p.x); ring.setAttribute("cy", p.y);
    nodeEls.forEach((pair, i)=>{
      const on = drawn >= nodeLens[i] - 2;
      pair[0].classList.toggle("on", on);
      pair[1].classList.toggle("on", on);
    });
    requestAnimationFrame(tick);
  }

  /* Idioma inicial: preferencia guardada > idioma del navegador > ES */
  let saved = null;
  try{ saved = localStorage.getItem("pb-lang"); }catch(e){}
  const initial = (saved === "en" || saved === "es")
    ? saved
    : ((navigator.language || "es").toLowerCase().indexOf("en") === 0 ? "en" : "es");
  applyLang(initial);

  if(!RM) requestAnimationFrame(tick);
  let rb;
  function rebuild(){ clearTimeout(rb); rb = setTimeout(buildRoute, 220); }
  addEventListener("resize", rebuild);
  if(window.ResizeObserver) new ResizeObserver(rebuild).observe(document.body);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=> setTimeout(buildRoute, 60));
})();
</script>
</body>
</html>
